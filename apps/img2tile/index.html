  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.canvas-toolbar {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  background: #101318;
}
.tool-group {
  display: flex;
  align-items: center;
  gap: 4px;
}
.tool-group button {
  height: 32px;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 0 9px;
  color: #929ca9;
  background: transparent;
  cursor: pointer;
  font-size: 10px;
  white-space: nowrap;
}
.tool-group button:hover {
  background: #1b2027;
  color: white;
}
.zoom-controls {
  font-family: "IBM Plex Mono";
}
.zoom-controls span {
  min-width: 45px;
  color: var(--muted);
  text-align: center;
  font-size: 10px;
}
.canvas-wrap {
  min-height: 0;
  position: relative;
  overflow: hidden;
  background: #d4d7dc;
}
.canvas-wrap canvas {
  display: block;
  touch-action: none;
}
.canvas-wrap.tool-create canvas {
  cursor: crosshair;
}
.canvas-wrap.space-pan canvas {
  cursor: grab;
}
.canvas-wrap.is-panning canvas {
  cursor: grabbing;
}
.canvas-status {
  position: absolute;
  right: 12px;
  bottom: 10px;
  padding: 5px 8px;
  border: 1px solid #2b323b;
  border-radius: 4px;
  color: #77818f;
  background: rgba(11, 13, 16, 0.82);
  font: 9px "IBM Plex Mono";
  pointer-events: none;
}

.export-panel {
  height: auto;
}
.export-panel fieldset {
  margin: 18px 0;
  padding: 0;
  border: 0;
}
.export-panel fieldset:disabled {
  opacity: 0.45;
}
.export-panel fieldset:disabled .radio-row {
  cursor: not-allowed;
}
.format-note {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 9px;
}
.export-panel legend {
  margin-bottom: 8px;
}
.field-label {
  color: var(--muted);
  font-size: 10px;
}
.segmented {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  padding: 3px;
  border: 1px solid #2d343d;
  border-radius: 6px;
  background: #0f1216;
}
.segmented label {
  cursor: pointer;
}
.segmented input {
  position: absolute;
  opacity: 0;
}
.segmented span {
  display: block;
  padding: 7px 3px;
  border-radius: 3px;
  color: var(--muted);
  text-align: center;
  font: 10px "IBM Plex Mono";
}
.segmented input:checked + span,
.tool-segmented button[aria-pressed="true"] {
  color: #0b1114;
  background: var(--accent);
  font-weight: 700;
}
.radio-row {
  display: flex;
  align-items: start;
  gap: 8px;
  margin: 7px 0;
  padding: 9px;
  border: 1px solid #292f38;
  border-radius: 6px;
  cursor: pointer;
}
.radio-row:has(input:checked) {
  border-color: #3b5a68;
  background: #17242a;
}
.radio-row input {
  margin: 2px 0 0;
  accent-color: var(--accent);
}
.radio-row span {
  display: grid;
  gap: 3px;
}
.radio-row strong {
  font-size: 10px;
}
.radio-row small {
  color: var(--muted);
  font-size: 8px;
}
.export-button {
  width: 100%;
  border: 0;
  color: #071114;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  font-weight: 800;
}
.export-note {
  color: #687383;
  text-align: center;
  font-size: 9px;
}
.export-note.invalid {
  color: var(--danger);
}

.progress-toast,
.notice-toast {
  position: fixed;
  z-index: 30;
  right: 18px;
  bottom: 18px;
  width: 330px;
  padding: 13px;
  border: 1px solid #3a4652;
  border-radius: 8px;
  background: #171c22;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
  font-size: 11px;
}
.progress-toast > div {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.progress-toast progress {
  width: 100%;
  height: 4px;
  accent-color: var(--accent);
}
.progress-toast button {
  margin-top: 7px;
  border: 0;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  font-size: 9px;
}
.notice-toast {
  border-color: #315944;
  color: #b9f6d6;
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.narrow-warning {
  display: none;
}

@media (max-width: 1050px) {
  .workspace.loaded {
    grid-template-columns: 230px minmax(300px, 1fr) 220px;
  }
  .tool-group button {
    padding: 0 6px;
  }
}

@media (max-width: 800px) {
  .app {
    grid-template-rows: 55px minmax(0, 1fr) 28px;
  }
  .workspace.loaded {
    grid-template-columns: 190px minmax(280px, 1fr);
    grid-template-rows: minmax(280px, 1fr) minmax(0, 220px);
  }
  .right-sidebar {
    grid-column: 1 / -1;
    min-height: 0;
    overflow: auto;
    border-top: 1px solid var(--line);
  }
  .narrow-warning {
    display: grid;
    place-items: center;
    color: #d6b477;
    background: #2a2115;
    font-size: 9px;
  }
}

.drop-zone .drop-error {
  margin: 18px 0 0;
  color: var(--danger);
  font-size: 12px;
}

.multi-selection {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  flex-wrap: wrap;
}
.history-controls {
  flex-wrap: wrap;
}
.canvas-toolbar {
  flex-wrap: wrap;
}
.segmentation-settings {
  padding: 14px;
  border-bottom: 1px solid #30353d;
}
.segmentation-settings summary {
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
}
.segmentation-settings:has(> fieldset:disabled) {
  opacity: 0.45;
}
.segmentation-settings fieldset {
  border: 0;
  padding: 10px 0;
  margin: 0;
  min-width: 0;
}
.segmentation-settings legend {
  padding-top: 12px;
}
.segmentation-number {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 10px 0;
}
.segmentation-number input {
  width: 80px;
}
.segmentation-checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
}
.segmentation-checkbox input {
  margin: 0;
}
.segmentation-settings small {
  display: block;
}
.replace-dialog {
  max-width: 480px;
}
.replace-dialog form {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.tool-character,
.tool-exclude {
  cursor: crosshair;
}
.canvas-toolbar {
  flex-wrap: wrap;
}

/* Tool icons are original inline SVGs, sized independently of text labels. */
button svg,
summary svg {
  width: 16px;
  height: 16px;
  flex: none;
  vertical-align: middle;
}
.segmentation-settings summary svg {
  margin-right: 6px;
}
.tooltip-anchor {
  display: inline-flex;
  align-items: center;
}
.help-tooltip {
  position: fixed;
  z-index: 100;
  width: max-content;
  max-width: min(240px, calc(100vw - 16px));
  max-height: calc(100vh - 16px);
  overflow: auto;
  padding: 10px 12px;
  border: 1px solid #596575;
  border-radius: 6px;
  background: #202630;
  color: #f2f5f9;
  box-shadow: 0 4px 18px #0006;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  pointer-events: none;
}
button.help-button {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  padding: 3px;
  border: 0;
  border-radius: 4px;
  color: var(--muted);
  background: transparent;
  cursor: help;
}
button.help-button:hover {
  color: white;
  background: #303945;
}
.export-panel legend .tooltip-anchor {
  margin-left: 6px;
  vertical-align: middle;
}
.canvas-toolbar {
  gap: 6px;
  padding-inline: 8px;
  justify-content: flex-start;
}
.tool-group {
  flex-shrink: 0;
  gap: 2px;
}
.tool-group button {
  padding-inline: 6px;
}
.tool-segmented {
  grid-template-columns: repeat(4, auto);
  gap: 3px;
  /* The 40px frame fits in the toolbar's existing vertical padding. */
  margin-block: -4px;
}
.tool-segmented button {
  border-radius: 3px;
}
.auto-controls {
  border-left: 1px solid #45505e;
  padding-left: 7px;
}
.tool-group .auto-button {
  color: #071114;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  font-weight: 700;
}
.tool-group .auto-button:hover {
  color: #071114;
  filter: brightness(1.1);
}
.tool-group .icon-button {
  width: 30px;
  padding: 6px;
  display: grid;
  place-items: center;
}
.history-controls {
  flex-wrap: nowrap;
}
.zoom-controls {
  margin-left: auto;
}
.zoom-controls span {
  min-width: 36px;
}
